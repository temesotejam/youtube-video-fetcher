name: Test full VISIONOS media fetch

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-visionos-stream-static.yml"
      - "cloudflare-free-probe/src/browser-mp4-visionos-segmented-stream-probe.js"
      - "cloudflare-free-probe/wrangler-visionos-stream-probe.jsonc"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check full-stream Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-visionos-segmented-stream-probe.js

      - name: Deploy static full-stream Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-visionos-stream-probe.jsonc

      - name: Fetch full video-only MP4
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p output
          CODE=$(curl -sS --max-time 300 -D output/video.headers.txt -o output/video-only.mp4 -w "%{http_code}" "${BASE_URL%/}/stream/video")
          echo "http_code=$CODE"
          test "$CODE" = "200"
          VIDEO_EXPECTED=$(grep -i '^x-source-total-bytes:' output/video.headers.txt | tail -1 | awk '{print $2}' | tr -d '\r')
          VIDEO_ACTUAL=$(stat -c%s output/video-only.mp4)
          echo "video_expected=$VIDEO_EXPECTED"
          echo "video_actual=$VIDEO_ACTUAL"
          test "$VIDEO_ACTUAL" -eq "$VIDEO_EXPECTED"
          grep -qi '^content-type: video/mp4' output/video.headers.txt
          grep -qi '^x-upstream-status: 206' output/video.headers.txt
          grep -qi '^x-source-itag: 298' output/video.headers.txt
          grep -qi '^x-capture-method: visionos-cdp-full-segmented-stream' output/video.headers.txt
          sha256sum output/video-only.mp4

      - name: Respect Browser Run session interval
        run: sleep 20

      - name: Fetch full audio-only MP4
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 180 -D output/audio.headers.txt -o output/audio-only.m4a -w "%{http_code}" "${BASE_URL%/}/stream/audio")
          echo "http_code=$CODE"
          test "$CODE" = "200"
          AUDIO_EXPECTED=$(grep -i '^x-source-total-bytes:' output/audio.headers.txt | tail -1 | awk '{print $2}' | tr -d '\r')
          AUDIO_ACTUAL=$(stat -c%s output/audio-only.m4a)
          echo "audio_expected=$AUDIO_EXPECTED"
          echo "audio_actual=$AUDIO_ACTUAL"
          test "$AUDIO_ACTUAL" -eq "$AUDIO_EXPECTED"
          grep -qi '^content-type: audio/mp4' output/audio.headers.txt
          grep -qi '^x-upstream-status: 206' output/audio.headers.txt
          grep -qi '^x-capture-method: visionos-cdp-full-segmented-stream' output/audio.headers.txt
          grep -i -E '^(x-source-itag|x-source-total-bytes|x-segment-count):' output/audio.headers.txt || true
          sha256sum output/audio-only.m4a

      - name: Remux video and audio
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -y -loglevel warning \
            -i output/video-only.mp4 \
            -i output/audio-only.m4a \
            -map 0:v:0 -map 1:a:0 \
            -c copy output/video.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name -of json output/video.mp4 | tee output/ffprobe.json
          sha256sum output/video.mp4

      - name: Upload fixed-test MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-visionos-fixed-test
          retention-days: 1
          path: |
            output/video.mp4
            output/video-only.mp4
            output/audio-only.m4a
            output/video.headers.txt
            output/audio.headers.txt
            output/ffprobe.json
