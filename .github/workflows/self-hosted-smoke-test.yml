name: Self-hosted YouTube smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/self-hosted-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: self-hosted-smoke
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Create temporary Python environment
        shell: cmd
        run: |
          py -3.12 --version
          py -3.12 -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install --upgrade "yt-dlp[default]"
          .venv\Scripts\python.exe -m yt_dlp --version

      - name: Set up Deno locally
        shell: cmd
        run: |
          if exist ".deno" rmdir /s /q ".deno"
          if exist "deno.zip" del /q "deno.zip"
          mkdir .deno
          curl.exe -L --fail --retry 3 -o deno.zip https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath 'deno.zip' -DestinationPath '.deno' -Force"
          .deno\deno.exe --version
          echo %CD%\.deno>>"%GITHUB_PATH%"

      - name: Fetch test A progressive MP4
        id: test_a
        continue-on-error: true
        shell: cmd
        run: |
          if not exist "output-test-a" mkdir "output-test-a"
          .venv\Scripts\python.exe -m yt_dlp --no-playlist --newline --write-info-json -f "18/b[ext=mp4]/b" -o "output-test-a\video.%%(ext)s" "https://youtu.be/udrtKw3Fljk"

      - name: Fetch test B progressive MP4
        id: test_b
        continue-on-error: true
        shell: cmd
        run: |
          if not exist "output-test-b" mkdir "output-test-b"
          .venv\Scripts\python.exe -m yt_dlp --no-playlist --newline --write-info-json -f "18/b[ext=mp4]/b" -o "output-test-b\video.%%(ext)s" "https://youtu.be/ZhMakZuBU-o?list=RDZhMakZuBU-o"

      - name: Show generated files
        if: always()
        shell: cmd
        run: |
          echo ===== TEST A =====
          if exist "output-test-a" dir /-C "output-test-a"
          echo ===== TEST B =====
          if exist "output-test-b" dir /-C "output-test-b"

      - name: Upload test A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "self-hosted-smoke-test-a-${{ github.run_id }}"
          path: "output-test-a/"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload test B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "self-hosted-smoke-test-b-${{ github.run_id }}"
          path: "output-test-b/"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Report smoke-test result
        if: always()
        shell: cmd
        run: |
          echo test_a=${{ steps.test_a.outcome }}
          echo test_b=${{ steps.test_b.outcome }}
          if /I not "${{ steps.test_a.outcome }}"=="success" exit /b 1
          if /I not "${{ steps.test_b.outcome }}"=="success" exit /b 1

      - name: Clean temporary files
        if: always()
        shell: cmd
        run: |
          if exist "output-test-a" rmdir /s /q "output-test-a"
          if exist "output-test-b" rmdir /s /q "output-test-b"
          if exist ".venv" rmdir /s /q ".venv"
          if exist ".deno" rmdir /s /q ".deno"
          if exist "deno.zip" del /q "deno.zip"
