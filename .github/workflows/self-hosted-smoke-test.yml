name: Self-hosted YouTube smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/self-hosted-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: self-hosted-smoke
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Create temporary Python environment
        shell: cmd
        run: |
          py -3.12 --version
          py -3.12 -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install --upgrade "yt-dlp[default]"
          .venv\Scripts\python.exe -m yt_dlp --version

      - name: Set up Deno locally
        shell: cmd
        run: |
          if exist ".deno" rmdir /s /q ".deno"
          if exist "deno.zip" del /q "deno.zip"
          mkdir .deno
          curl.exe -L --fail --retry 3 -o deno.zip https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath 'deno.zip' -DestinationPath '.deno' -Force"
          .deno\deno.exe --version
          echo %CD%\.deno>>"%GITHUB_PATH%"

      - name: Set up FFmpeg locally
        shell: cmd
        run: |
          if exist ".ffmpeg" rmdir /s /q ".ffmpeg"
          if exist "ffmpeg.zip" del /q "ffmpeg.zip"
          mkdir .ffmpeg
          curl.exe -L --fail --retry 3 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath 'ffmpeg.zip' -DestinationPath '.ffmpeg' -Force"
          .venv\Scripts\python.exe -c "import os,pathlib; p=next(pathlib.Path('.ffmpeg').rglob('ffmpeg.exe')).parent.resolve(); print(p); open(os.environ['GITHUB_PATH'],'a',encoding='utf-8').write(str(p)+'\n')"

      - name: Fetch 10-second test A clip
        id: test_a
        continue-on-error: true
        shell: cmd
        run: |
          .venv\Scripts\python.exe scripts\fetch_video.py "https://youtu.be/udrtKw3Fljk" --start 00:00:00 --end 00:00:10 --output-dir output-test-a

      - name: Fetch 10-second test B clip
        id: test_b
        continue-on-error: true
        shell: cmd
        run: |
          .venv\Scripts\python.exe scripts\fetch_video.py "https://youtu.be/ZhMakZuBU-o?list=RDZhMakZuBU-o" --start 00:00:00 --end 00:00:10 --output-dir output-test-b

      - name: Show generated files
        if: always()
        shell: cmd
        run: |
          echo ===== TEST A =====
          if exist "output-test-a" dir /-C "output-test-a"
          echo ===== TEST B =====
          if exist "output-test-b" dir /-C "output-test-b"

      - name: Upload test A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "self-hosted-smoke-test-a-${{ github.run_id }}"
          path: "output-test-a/"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload test B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "self-hosted-smoke-test-b-${{ github.run_id }}"
          path: "output-test-b/"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Clean temporary files
        if: always()
        shell: cmd
        run: |
          if exist "output-test-a" rmdir /s /q "output-test-a"
          if exist "output-test-b" rmdir /s /q "output-test-b"
          if exist ".venv" rmdir /s /q ".venv"
          if exist ".deno" rmdir /s /q ".deno"
          if exist ".ffmpeg" rmdir /s /q ".ffmpeg"
          if exist "deno.zip" del /q "deno.zip"
          if exist "ffmpeg.zip" del /q "ffmpeg.zip"

      - name: Report smoke-test result
        if: always()
        shell: cmd
        run: |
          echo test_a=${{ steps.test_a.outcome }}
          echo test_b=${{ steps.test_b.outcome }}
          if /I "${{ steps.test_a.outcome }}"=="failure" exit /b 1
          if /I "${{ steps.test_b.outcome }}"=="failure" exit /b 1
