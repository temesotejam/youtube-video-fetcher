name: Self-hosted YouTube smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/self-hosted-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-a
            url: "https://youtu.be/udrtKw3Fljk"
          - name: test-b
            url: "https://youtu.be/ZhMakZuBU-o?list=RDZhMakZuBU-o"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Create temporary Python environment
        shell: cmd
        run: |
          py -3.12 --version
          py -3.12 -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install --upgrade "yt-dlp[default]"
          .venv\Scripts\python.exe -m yt_dlp --version

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch progressive MP4
        shell: cmd
        run: |
          if not exist "output-${{ matrix.name }}" mkdir "output-${{ matrix.name }}"
          .venv\Scripts\python.exe -m yt_dlp --no-playlist --newline --write-info-json -f "18/b[ext=mp4]/b" -o "output-${{ matrix.name }}\video.%%(ext)s" "${{ matrix.url }}"

      - name: Show generated files
        if: always()
        shell: cmd
        run: |
          if exist "output-${{ matrix.name }}" dir /-C "output-${{ matrix.name }}"

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "self-hosted-smoke-${{ matrix.name }}-${{ github.run_id }}"
          path: "output-${{ matrix.name }}/"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Clean temporary files
        if: always()
        shell: cmd
        run: |
          if exist "output-${{ matrix.name }}" rmdir /s /q "output-${{ matrix.name }}"
          if exist ".venv" rmdir /s /q ".venv"
