name: Fetch YouTube video

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      start_time:
        description: "Optional start time (e.g. 00:03:20)"
        required: false
        default: ""
        type: string
      end_time:
        description: "Optional end time (e.g. 00:03:40)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch media
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Fetch video
        id: fetch
        shell: bash
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          START_TIME: ${{ inputs.start_time }}
          END_TIME: ${{ inputs.end_time }}
        run: |
          set -o pipefail
          args=("$YOUTUBE_URL" "--output-dir" "output")
          if [[ -n "$START_TIME" || -n "$END_TIME" ]]; then
            args+=("--start" "$START_TIME" "--end" "$END_TIME")
          fi
          python scripts/fetch_video.py "${args[@]}"

      - name: Show generated files
        if: always()
        run: |
          echo "Generated files:"
          find output -maxdepth 1 -type f -printf '%f\t%s bytes\n' 2>/dev/null || true

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
