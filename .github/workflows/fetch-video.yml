name: Fetch YouTube video

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      start_time:
        description: "Optional start time (e.g. 00:03:20)"
        required: false
        default: ""
        type: string
      end_time:
        description: "Optional end time (e.g. 00:03:40)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch media
    runs-on: [self-hosted, windows, x64, youtube-fetcher]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno for YouTube JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install yt-dlp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"
          python -m yt_dlp --version
          deno --version
          ffmpeg -version | Select-Object -First 1

      - name: Fetch video
        id: fetch
        shell: pwsh
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          START_TIME: ${{ inputs.start_time }}
          END_TIME: ${{ inputs.end_time }}
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @($env:YOUTUBE_URL, "--output-dir", "output")
          if ($env:START_TIME -or $env:END_TIME) {
            $arguments += @("--start", $env:START_TIME, "--end", $env:END_TIME)
          }
          python scripts/fetch_video.py @arguments

      - name: Show generated files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path output) {
            Get-ChildItem output -File | ForEach-Object {
              "{0}`t{1} bytes" -f $_.Name, $_.Length
            }
          }

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Remove downloaded media from runner workspace
        if: always()
        shell: pwsh
        run: |
          if (Test-Path output) {
            Remove-Item output -Recurse -Force
          }
