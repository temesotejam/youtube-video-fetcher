name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free Browser MP4 probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-same-origin.js

      - name: Deploy Browser MP4 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Download one 64 KiB nonzero video chunk body through Browser Run
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          VIDEO_ID: 2NJdNKJ9LPM
          CHUNK_BYTES: "65536"
          CHUNK_START: "4194304"
        run: |
          set -euo pipefail
          echo "Waiting for the new Worker to become reachable..."
          sleep 5
          mkdir -p output/headers output/chunks
          BASE="${PROBE_BASE_URL%/}"
          OUT="output/chunks/video.nonzero-64k.bin"
          HEADERS="output/headers/video.nonzero-64k.headers.txt"
          URL="${BASE}/chunk/video?v=${VIDEO_ID}&start=${CHUNK_START}&length=${CHUNK_BYTES}"
          echo "base=${BASE}"
          echo "Fetching one nonzero chunk body: start=${CHUNK_START}, length=${CHUNK_BYTES}"
          set +e
          HTTP_CODE=$(curl -sS --max-time 90 -D "${HEADERS}" -o "${OUT}" -w "%{http_code}" "${URL}")
          CURL_STATUS=$?
          set -e
          echo "curl_status=${CURL_STATUS}"
          echo "http_code=${HTTP_CODE}"
          SIZE="$(stat -c%s "${OUT}" 2>/dev/null || echo 0)"
          echo "bytes=${SIZE}"
          echo "--- response headers ---"
          grep -i -E '^(http/|content-type|content-length|x-upstream-content-range|x-chunk-start|x-chunk-end|x-source-total-bytes|x-source-itag|x-capture-method|x-piece-count|x-piece-bytes|x-paid-cloudflare-feature):' "${HEADERS}" || true
          if [ "${CURL_STATUS}" -ne 0 ] || [ "${HTTP_CODE}" != "200" ] || [ "${SIZE}" -ne "${CHUNK_BYTES}" ]; then
            echo "Unexpected response body preview:"
            python3 - <<PY
          from pathlib import Path
          p = Path('${OUT}')
          data = p.read_bytes() if p.exists() else b''
          print(data[:1000].decode('utf-8', errors='replace'))
          PY
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          data = Path('output/chunks/video.nonzero-64k.bin').read_bytes()
          print('chunk_bytes=' + str(len(data)))
          print('first16_hex=' + data[:16].hex())
          if len(data) != 65536:
              raise SystemExit('wrong chunk length')
          PY
