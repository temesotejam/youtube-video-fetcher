name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - "cloudflare-free-probe/**"
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free Browser MP4 probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-probe.js

      - name: Deploy Browser MP4 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Download selected 1 MiB video chunks through Browser Run
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          VIDEO_ID: 2NJdNKJ9LPM
          CHUNK_BYTES: "1048576"
        run: |
          set -euo pipefail
          echo "Waiting for the new Worker to become reachable..."
          sleep 5
          mkdir -p output/headers output/chunks
          BASE="${PROBE_BASE_URL%/}"
          echo "base=${BASE}"

          fetch_chunk() {
            local index="$1"
            local start="$2"
            local out="output/chunks/video.part${index}.bin"
            local headers="output/headers/video.part${index}.headers.txt"
            local url="${BASE}/chunk/video?v=${VIDEO_ID}&start=${start}&length=${CHUNK_BYTES}"
            echo "Fetching video chunk ${index}: start=${start}, length=${CHUNK_BYTES}"
            echo "url_path=/chunk/video"
            curl -sS --fail-with-body --max-time 90 -D "${headers}" -o "${out}" "${url}"
            local size
            size="$(stat -c%s "${out}")"
            echo "bytes=${size}"
            echo "--- response headers ${index} ---"
            grep -i -E '^(http/|content-type|content-length|x-upstream-content-range|x-chunk-start|x-chunk-end|x-source-total-bytes|x-source-itag|x-browser-run|x-paid-cloudflare-feature):' "${headers}" || true
            if [ "${size}" -ne "${CHUNK_BYTES}" ]; then
              echo "Unexpected body size. Body preview:"
              python3 - <<PY
          from pathlib import Path
          p = Path('${out}')
          data = p.read_bytes()
          print(data[:1000].decode('utf-8', errors='replace'))
          PY
              exit 1
            fi
          }

          fetch_chunk 000 0
          fetch_chunk 001 1048576
          fetch_chunk 004 4194304

          cat output/chunks/video.part000.bin output/chunks/video.part001.bin > output/video-prefix-2m.bin
          test "$(stat -c%s output/video-prefix-2m.bin)" -eq "$((2 * CHUNK_BYTES))"
          python3 - <<'PY'
          from pathlib import Path
          prefix = Path('output/video-prefix-2m.bin').read_bytes()[:32]
          print('prefix_hex=' + prefix.hex())
          print('contains_ftyp=' + str(b'ftyp' in prefix).lower())
          if b'ftyp' not in prefix:
              raise SystemExit('MP4 ftyp signature not found in first 32 bytes')
          PY
