name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - "cloudflare-free-probe/**"
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free MP4 probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/client-probe.js

      - name: Deploy dedicated MP4 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Run free MP4 stream probe
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Waiting for the new Worker to become reachable..."
          sleep 5
          echo "Testing progressive and adaptive MP4 streams; no full download and no Browser Run."
          curl -sS --max-time 75 "${PROBE_BASE_URL}/probe/client?v=2NJdNKJ9LPM"
          echo
