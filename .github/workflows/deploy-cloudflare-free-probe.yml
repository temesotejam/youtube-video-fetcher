name: Deploy free Cloudflare Browser Run probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - "cloudflare-free-probe/**"
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free Browser Run probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/index.js

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Run one free Browser Run probe
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Running one metadata-only Browser Run probe; no media download."
          curl -sS --fail-with-body --max-time 45 "${PROBE_BASE_URL}/probe?v=2NJdNKJ9LPM"
          echo
