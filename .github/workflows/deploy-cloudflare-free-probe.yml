name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-cdp-size-probe.js

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Run single-browser CDP size probe
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p output
          URL="${BASE_URL%/}/cdp/probe/sizes?v=2NJdNKJ9LPM"
          CODE=$(curl -sS --max-time 150 -o output/result.json -w "%{http_code}" "$URL")
          echo "http_code=$CODE"
          cat output/result.json
          test "$CODE" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/result.json').read_text())
          print('browser_session_count=', data.get('browser_session_count'))
          for item in data.get('results', []):
              print('size=', item.get('requested_bytes'), 'success=', item.get('success'), 'status=', item.get('status'), 'received=', item.get('received_bytes'))
          if data.get('browser_session_count') != 1:
              raise SystemExit('expected one Browser Run session')
          PY
