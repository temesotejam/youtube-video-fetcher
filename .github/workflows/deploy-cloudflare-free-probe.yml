name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - "cloudflare-free-probe/**"
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free Browser MP4 probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-probe.js

      - name: Deploy Browser MP4 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Probe direct MP4 ranges inside one Browser Run session
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Waiting for the new Worker to become reachable..."
          sleep 5
          echo "Opening YouTube, requesting ANDROID_VR player data, then testing 0/4/8 MiB in the same Browser Run session."
          curl -sS --fail-with-body --max-time 90 "${PROBE_BASE_URL}/probe/ranges?v=2NJdNKJ9LPM"
          echo
