name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - "cloudflare-free-probe/**"
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free MP4 probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/relay-probe.js

      - name: Deploy dedicated MP4 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Verify MP4 relay readiness
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Waiting for the new Worker to become reachable..."
          sleep 5
          echo "Testing video/audio MP4 relay ranges; no full download and no Browser Run."
          curl -sS --fail-with-body --max-time 75 "${PROBE_BASE_URL}/probe?v=2NJdNKJ9LPM"
          echo

      - name: Probe nonzero ranges in one Worker invocation
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Resolving MP4 URLs once, then probing 0/4/8 MiB within one Worker request."
          curl -sS --fail-with-body --max-time 75 "${PROBE_BASE_URL}/probe/ranges?v=2NJdNKJ9LPM"
          echo
