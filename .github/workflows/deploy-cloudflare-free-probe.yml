name: Deploy free Cloudflare MP4 probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-cdp-stream.js

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-mp4-probe.jsonc

      - name: Test 1 MiB CDP media body
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p output
          URL="${BASE_URL%/}/cdp/chunk/video?v=2NJdNKJ9LPM&start=4194304&length=1048576"
          CODE=$(curl -sS --max-time 90 -D output/headers.txt -o output/chunk.bin -w "%{http_code}" "$URL")
          echo "http_code=$CODE"
          wc -c output/chunk.bin
          grep -i -E '^(content-type|content-length|x-upstream-content-range|x-source-itag|x-source-total-bytes|x-capture-method|x-cdp-read-count|x-cdp-read-size|x-cdp-eof):' output/headers.txt || true
          if [ "$CODE" != "200" ] || [ "$(stat -c%s output/chunk.bin)" -ne 1048576 ]; then
            python3 - <<'PY'
          from pathlib import Path
          print(Path('output/chunk.bin').read_bytes()[:1200].decode('utf-8', errors='replace'))
          PY
            exit 1
          fi
