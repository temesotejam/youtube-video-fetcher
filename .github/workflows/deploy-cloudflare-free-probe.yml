name: Deploy free Cloudflare Browser Run probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - "cloudflare-free-probe/**"
      - ".github/workflows/deploy-cloudflare-free-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy free Browser Run probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Browser Session dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/client-probe.js

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy

      - name: Show deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Run one worker-origin progressive MP4 probe
        env:
          PROBE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Waiting for Worker propagation..."
          sleep 10
          echo "Testing logged-out player clients for a progressive MP4 direct URL; no full download and no Browser Run."
          curl -sS --max-time 75 "${PROBE_BASE_URL}/probe/client?v=2NJdNKJ9LPM"
          echo
