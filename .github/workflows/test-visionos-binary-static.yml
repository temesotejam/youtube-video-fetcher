name: Test static VISIONOS binary delivery

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-visionos-binary-static.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Browser Run dependency
        working-directory: cloudflare-free-probe
        run: npm install --no-audit --no-fund

      - name: Check binary Worker syntax
        working-directory: cloudflare-free-probe
        run: node --check src/browser-mp4-visionos-binary-probe.js

      - name: Deploy static binary Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-free-probe
          command: deploy --config wrangler-visionos-binary-probe.jsonc

      - name: Download fixed 4 MiB chunk to runner
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p output
          CODE=$(curl -sS --max-time 120 -D output/headers.txt -o output/chunk.bin -w "%{http_code}" "${BASE_URL%/}/chunk/video")
          echo "http_code=$CODE"
          wc -c output/chunk.bin
          grep -i -E '^(content-type|content-length|x-upstream-status|x-upstream-content-range|x-source-itag|x-source-total-bytes|x-cdp-read-count):' output/headers.txt || true
          sha256sum output/chunk.bin
          test "$CODE" = "200"
          test "$(stat -c%s output/chunk.bin)" -eq 4194304
          grep -qi '^x-upstream-status: 206' output/headers.txt
          grep -qi '^x-source-itag: 298' output/headers.txt
          grep -qi '^x-upstream-content-range: bytes 20971520-25165823/80955133' output/headers.txt
