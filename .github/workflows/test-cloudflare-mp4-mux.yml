name: Test free Cloudflare MP4 mux

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-cloudflare-mp4-mux.yml"

permissions:
  contents: read

jobs:
  mux:
    name: Download relay streams and mux MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Create output directory
        run: mkdir -p output

      - name: Download video and audio as ranged chunks through Cloudflare
        env:
          VIDEO_URL: https://youtube-free-browser-probe.temesotejam-t265.workers.dev/relay/video?v=2NJdNKJ9LPM
          AUDIO_URL: https://youtube-free-browser-probe.temesotejam-t265.workers.dev/relay/audio?v=2NJdNKJ9LPM
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          CHUNK = 4 * 1024 * 1024
          RETRIES = 10

          def get_chunk(url, start, end):
              expected = end - start + 1
              last_error = None
              for attempt in range(1, RETRIES + 1):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Range": f"bytes={start}-{end}",
                          "Accept": "*/*",
                          "User-Agent": "youtube-video-fetcher-github-mux/0.1",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          status = response.status
                          content_range = response.headers.get("Content-Range")
                          body = response.read()
                      if status != 206:
                          raise RuntimeError(f"expected HTTP 206, got {status}")
                      if len(body) != expected:
                          raise RuntimeError(
                              f"range {start}-{end}: expected {expected} bytes, got {len(body)}"
                          )
                      if not content_range:
                          raise RuntimeError("missing Content-Range")
                      match = re.fullmatch(r"bytes (\d+)-(\d+)/(\d+|\*)", content_range)
                      if not match:
                          raise RuntimeError(f"unexpected Content-Range: {content_range}")
                      if int(match.group(1)) != start or int(match.group(2)) != end:
                          raise RuntimeError(f"mismatched Content-Range: {content_range}")
                      total = None if match.group(3) == "*" else int(match.group(3))
                      return body, total
                  except Exception as exc:
                      last_error = exc
                      print(f"range {start}-{end} attempt {attempt}/{RETRIES} failed: {exc}", flush=True)
                      if attempt < RETRIES:
                          time.sleep(min(2 * attempt, 10))
              raise RuntimeError(f"range {start}-{end} failed after {RETRIES} attempts: {last_error}")

          def download(url, destination):
              path = Path(destination)
              if path.exists():
                  path.unlink()

              first_end = CHUNK - 1
              first, total = get_chunk(url, 0, first_end)
              if total is None:
                  raise RuntimeError("upstream did not report total media size")

              print(f"{path.name}: total={total:,} bytes", flush=True)
              with path.open("wb") as output:
                  output.write(first)
                  start = len(first)
                  while start < total:
                      end = min(start + CHUNK - 1, total - 1)
                      part, part_total = get_chunk(url, start, end)
                      if part_total is not None and part_total != total:
                          raise RuntimeError(
                              f"total changed during download: {total} -> {part_total}"
                          )
                      output.write(part)
                      start = end + 1
                      print(
                          f"{path.name}: {start:,}/{total:,} ({100 * start / total:.1f}%)",
                          flush=True,
                      )

              actual = path.stat().st_size
              if actual != total:
                  raise RuntimeError(f"final size mismatch: expected {total}, got {actual}")
              print(f"{path.name}: COMPLETE {actual:,} bytes", flush=True)

          download(os.environ["VIDEO_URL"], "output/video-only.mp4")
          download(os.environ["AUDIO_URL"], "output/audio-only.m4a")
          PY
          ls -lh output/video-only.mp4 output/audio-only.m4a

      - name: Inspect downloaded streams
        run: |
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height -of json output/video-only.mp4
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of json output/audio-only.m4a

      - name: Mux video and audio without transcoding
        run: |
          ffmpeg -y \
            -i output/video-only.mp4 \
            -i output/audio-only.m4a \
            -map 0:v:0 -map 1:a:0 \
            -c copy \
            -movflags +faststart \
            output/video.mp4
          ls -lh output/video.mp4

      - name: Verify final MP4
        run: |
          ffprobe -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_type,codec_name,width,height \
            -of json output/video.mp4 | tee output/ffprobe.json
          test "$(stat -c%s output/video.mp4)" -gt 1000000
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 output/video.mp4)" = "video"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 output/video.mp4)" = "audio"

      - name: Upload combined MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-cloudflare-mp4-${{ github.run_id }}
          path: |
            output/video.mp4
            output/ffprobe.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Clean temporary media
        if: always()
        run: rm -rf output
