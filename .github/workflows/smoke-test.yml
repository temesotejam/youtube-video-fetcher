name: YouTube fetch smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-a
            url: "https://youtu.be/udrtKw3Fljk"
          - name: test-b
            url: "https://youtu.be/ZhMakZuBU-o?list=RDZhMakZuBU-o"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          yt-dlp --version
          deno --version
          ffmpeg -version | head -n 1

      - name: Fetch five-second sample
        shell: bash
        run: |
          python scripts/fetch_video.py "${{ matrix.url }}" \
            --start 00:00:00 \
            --end 00:00:05 \
            --output-dir "output-${{ matrix.name }}"

      - name: Show generated files
        if: always()
        run: |
          find "output-${{ matrix.name }}" -maxdepth 1 -type f -printf '%f\t%s bytes\n' 2>/dev/null || true

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "smoke-${{ matrix.name }}-${{ github.run_id }}"
          path: "output-${{ matrix.name }}/"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
