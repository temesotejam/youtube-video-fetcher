name: Deploy experimental Cloudflare YouTube probe

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-cloudflare-container
    paths:
      - "cloudflare-probe/**"
      - ".github/workflows/deploy-cloudflare-probe.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: cloudflare-probe
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        working-directory: cloudflare-probe
        run: node --check src/index.js

      - name: Check Python syntax
        working-directory: cloudflare-probe
        run: python3 -m py_compile server.py

      - name: Deploy Worker and Container
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-probe
          command: deploy
