name: Test Browser Run MP4 chunk transfer

on:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-browser-chunk-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fetch one real 64 KiB MP4 chunk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify 64 KiB at 4 MiB offset
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.error
          import urllib.request

          url = (
              "https://youtube-free-browser-probe.temesotejam-t265.workers.dev/"
              "chunk/video?v=2NJdNKJ9LPM&start=4194304&length=65536"
          )
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "youtube-video-fetcher-64k-transfer-test/0.1"},
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  status = response.status
                  headers = response.headers
                  data = response.read()
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"worker_http_status={exc.code}")
              print(f"worker_error_body={body[:4096]}")
              raise SystemExit(1)

          print(f"worker_http_status={status}")
          print(f"upstream_status={headers.get('X-Upstream-Status')}")
          print(f"upstream_content_range={headers.get('X-Upstream-Content-Range')}")
          print(f"capture_method={headers.get('X-Capture-Method')}")
          print(f"content_type={headers.get('Content-Type')}")
          print(f"received_bytes={len(data)}")
          print(f"sha256={hashlib.sha256(data).hexdigest()}")
          print(f"first16={data[:16].hex()}")
          print(f"last16={data[-16:].hex()}")

          if status != 200:
              raise SystemExit(f"unexpected Worker status: {status}")
          if headers.get("X-Upstream-Status") != "206":
              raise SystemExit("upstream did not return 206")
          if headers.get("X-Upstream-Content-Range") != "bytes 4194304-4259839/80955133":
              raise SystemExit("unexpected Content-Range")
          if len(data) != 65536:
              raise SystemExit(f"expected 65536 bytes, got {len(data)}")
          if not data or all(value == 0 for value in data):
              raise SystemExit("chunk is empty or all zero")

          print("RESULT=PASS_REAL_64K_BROWSER_MP4_CHUNK_TRANSFER")
          PY
