name: Test Browser Run MP4 chunk transfer

on:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-browser-chunk-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fetch one batched 1 MiB MP4 chunk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch 64 KiB x16 as one 1 MiB result
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.error
          import urllib.request

          url = (
              "https://youtube-free-browser-probe.temesotejam-t265.workers.dev/"
              "batch/video?v=2NJdNKJ9LPM&start=4194304&length=1048576"
          )
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "youtube-video-fetcher-1mib-batch-test/0.2"},
          )

          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  status = response.status
                  headers = response.headers
                  data = response.read()
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"worker_http_status={exc.code}")
              print(f"worker_error_body={body[:4096]}")
              raise SystemExit(1)

          print(f"worker_http_status={status}")
          print(f"upstream_status={headers.get('X-Upstream-Status')}")
          print(f"capture_method={headers.get('X-Capture-Method')}")
          print(f"piece_count={headers.get('X-Piece-Count')}")
          print(f"piece_bytes={headers.get('X-Piece-Bytes')}")
          print(f"first_piece_status={headers.get('X-First-Piece-Status')}")
          print(f"first_piece_bytes={headers.get('X-First-Piece-Bytes')}")
          print(f"last_piece_status={headers.get('X-Last-Piece-Status')}")
          print(f"last_piece_bytes={headers.get('X-Last-Piece-Bytes')}")
          print(f"source_total={headers.get('X-Source-Total-Bytes')}")
          print(f"received_bytes={len(data)}")
          print(f"sha256={hashlib.sha256(data).hexdigest()}")
          print(f"first16={data[:16].hex()}")
          print(f"last16={data[-16:].hex()}")

          checks = [
              status == 200,
              headers.get("X-Upstream-Status") == "206",
              headers.get("X-Capture-Method") == "same-origin-64k-batch-relaxed-header",
              headers.get("X-Piece-Count") == "16",
              headers.get("X-Piece-Bytes") == "65536",
              headers.get("X-First-Piece-Status") == "206",
              headers.get("X-First-Piece-Bytes") == "65536",
              headers.get("X-Last-Piece-Status") == "206",
              headers.get("X-Last-Piece-Bytes") == "65536",
              headers.get("X-Source-Total-Bytes") == "80955133",
              len(data) == 1048576,
              bool(data),
              not all(value == 0 for value in data),
          ]
          if not all(checks):
              raise SystemExit("1 MiB batch verification failed")

          print("RESULT=PASS_1MIB_FROM_16_X_64K_BROWSER_RANGES")
          PY
