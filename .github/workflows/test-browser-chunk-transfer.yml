name: Test Browser Run MP4 chunk transfer

on:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-browser-chunk-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Find stable Browser Run MP4 chunk size
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe several real chunk sizes at 4 MiB offset
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request

          base = (
              "https://youtube-free-browser-probe.temesotejam-t265.workers.dev/"
              "chunk/video?v=2NJdNKJ9LPM&start=4194304&length="
          )
          sizes = [65536, 131072, 262144, 524288, 1048576]
          results = []

          for size in sizes:
              url = base + str(size)
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "youtube-video-fetcher-chunk-size-probe/0.1"},
              )
              item = {"requested_bytes": size}
              started = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = response.read()
                      item.update({
                          "worker_status": response.status,
                          "upstream_status": response.headers.get("X-Upstream-Status"),
                          "upstream_content_range": response.headers.get("X-Upstream-Content-Range"),
                          "received_bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "ok": (
                              response.status == 200
                              and response.headers.get("X-Upstream-Status") == "206"
                              and len(data) == size
                          ),
                      })
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  item.update({
                      "worker_status": exc.code,
                      "error_body": body[:1000],
                      "ok": False,
                  })
              except Exception as exc:
                  item.update({"error": str(exc), "ok": False})

              item["elapsed_s"] = round(time.time() - started, 3)
              results.append(item)
              print(json.dumps(item, ensure_ascii=False), flush=True)
              time.sleep(1)

          passing = [r["requested_bytes"] for r in results if r.get("ok")]
          print(f"passing_sizes={passing}")
          print(f"largest_passing_size={max(passing) if passing else 0}")
          if not passing:
              raise SystemExit("no chunk size succeeded")
          print("RESULT=CHUNK_SIZE_PROBE_COMPLETE")
          PY
