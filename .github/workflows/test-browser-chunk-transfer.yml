name: Test Browser Run MP4 chunk transfer

on:
  push:
    branches:
      - experimental-cloudflare-free-browser
    paths:
      - ".github/workflows/test-browser-chunk-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fetch one 4 MiB format 18 MP4 chunk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify 4 MiB from progressive format 18
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.error
          import urllib.request

          url = (
              "https://youtube-free-browser-probe.temesotejam-t265.workers.dev/"
              "chunk/video?v=2NJdNKJ9LPM&start=4194304&length=4194304"
          )
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "youtube-video-fetcher-format18-test/0.1"},
          )

          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  status = response.status
                  headers = response.headers
                  data = response.read()
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"worker_http_status={exc.code}")
              print(f"worker_error_body={body[:4096]}")
              raise SystemExit(1)

          print(f"worker_http_status={status}")
          print(f"upstream_status={headers.get('X-Upstream-Status')}")
          print(f"upstream_content_range={headers.get('X-Upstream-Content-Range')}")
          print(f"capture_method={headers.get('X-Capture-Method')}")
          print(f"source_itag={headers.get('X-Source-Itag')}")
          print(f"has_audio={headers.get('X-Has-Audio')}")
          print(f"chunk_start={headers.get('X-Chunk-Start')}")
          print(f"chunk_end={headers.get('X-Chunk-End')}")
          print(f"source_total={headers.get('X-Source-Total-Bytes')}")
          print(f"content_type={headers.get('Content-Type')}")
          print(f"received_bytes={len(data)}")
          print(f"sha256={hashlib.sha256(data).hexdigest()}")
          print(f"first16={data[:16].hex()}")
          print(f"last16={data[-16:].hex()}")

          checks = [
              status == 200,
              headers.get("X-Upstream-Status") == "206",
              headers.get("X-Capture-Method") == "format18-same-origin-range",
              headers.get("X-Source-Itag") == "18",
              headers.get("X-Has-Audio") == "true",
              headers.get("X-Chunk-Start") == "4194304",
              headers.get("X-Chunk-End") == "8388607",
              headers.get_content_type() == "video/mp4",
              len(data) == 4194304,
              bool(data),
              not all(value == 0 for value in data),
          ]
          if not all(checks):
              raise SystemExit("4 MiB format 18 verification failed")

          print("RESULT=PASS_REAL_4MIB_FORMAT18_MP4_TRANSFER")
          PY
